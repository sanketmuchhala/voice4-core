[project]
name = "bolchaal-contracts"
version = "0.1.0"
description = "Locked shared schemas between Bolchaal services"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bolchaal_contracts"]
