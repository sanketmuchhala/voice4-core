[project]
name = "voice4-core"
version = "0.0.0"
description = "voice4-core monorepo root (virtual workspace)"
requires-python = ">=3.12"
dependencies = [
    "voice4-contracts",
    "voice4-telephony-gateway",
    "voice4-tool-crm-adapter",
    "voice4-voice-orchestrator",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.uv.sources]
voice4-contracts = { workspace = true }
voice4-telephony-gateway = { workspace = true }
voice4-tool-crm-adapter = { workspace = true }
voice4-voice-orchestrator = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["packages", "services", "apps"]
addopts = "--import-mode=importlib -q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".worktrees"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]


[tool.ruff.lint.isort]
known-first-party = ["voice4_contracts", "telephony_gateway", "tool_crm_adapter", "voice_orchestrator"]

[tool.ruff.lint.per-file-ignores]
"streamlit_app.py" = ["E501"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = [
    "packages/contracts/src",
    "packages/contracts/tests",
    "services/telephony-gateway/src",
    "services/telephony-gateway/tests",
    "services/tool-crm-adapter/src",
    "services/tool-crm-adapter/tests",
    "services/voice-orchestrator/src",
    "services/voice-orchestrator/tests",
    "apps/eval-harness",
]
exclude = ["\\.worktrees/"]

