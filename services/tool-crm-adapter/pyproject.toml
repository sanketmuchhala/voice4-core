[project]
name = "voice4-tool-crm-adapter"
version = "0.1.0"
description = "COD order tools and Roman-script normalization"
requires-python = ">=3.12"
dependencies = ["voice4-contracts"]

[tool.uv.sources]
voice4-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tool_crm_adapter"]
