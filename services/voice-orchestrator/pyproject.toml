[project]
name = "bolchaal-voice-orchestrator"
version = "0.1.0"
description = "Streaming STT -> LLM -> TTS loop with turn-taking and barge-in"
requires-python = ">=3.12"
dependencies = ["bolchaal-contracts"]

[tool.uv.sources]
bolchaal-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_orchestrator"]
