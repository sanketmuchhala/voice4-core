[project]
name = "bolchaal-telephony-gateway"
version = "0.1.0"
description = "Carrier ingress, pre-dial TRAI/DPDP compliance guard, warm transfer"
requires-python = ">=3.12"
dependencies = ["bolchaal-contracts"]

[tool.uv.sources]
bolchaal-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telephony_gateway"]
